services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agri-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MONGODB_URL=mongodb://mongo:27017
    restart: unless-stopped
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agri-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend

  mongo:
    image: mongo:7.0
    container_name: agri-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
